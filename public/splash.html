<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scripture in Music</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: #f4f0e8;
        background: #0b1220;
        background-image: radial-gradient(circle at 20% 0%, rgba(201,168,106,.16), transparent 52%), linear-gradient(145deg, #0b1220, #111b2e 65%, #08101d);
      }
      .splash { width: 100%; height: 100%; display: grid; place-items: center; text-align: center; padding: 48px; }
      .mark { width: 104px; height: 104px; filter: drop-shadow(0 18px 28px rgba(0,0,0,.3)); animation: settle 900ms ease-out both; }
      h1 { margin: 22px 0 8px; font-size: 28px; font-weight: 650; letter-spacing: .01em; }
      p { margin: 0; color: #a9b4c4; font-size: 13px; letter-spacing: .04em; }
      .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 30px; color: #c9a86a; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #c9a86a; box-shadow: 0 0 0 5px rgba(201,168,106,.12); }
      @keyframes settle { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Loading Scripture in Music">
      <div>
        <img class="mark" src="/icon.svg" alt="" />
        <h1>Scripture in Music</h1>
        <p>Offline scripture memorization and music practice</p>
        <div class="status"><span class="dot"></span> Local workspace</div>
      </div>
    </main>
  </body>
</html>
